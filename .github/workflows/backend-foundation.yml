name: Backend foundation checks

on:
  push:
    branches:
      - refactor/remove-payload-prisma-backend
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prisma-foundation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/acroreader?sslmode=require
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/acroreader?sslmode=require
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-payload-prisma-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: update npm lockfile for Prisma"
            git push
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          AUTH_SECRET: ci-only-secret-for-build-validation
        run: npm run build
